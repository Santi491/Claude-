name: CargoBrothers
options:
  bundleIdPrefix: com.cargobrothers
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Base.xcconfig
  Release: Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CargoBrothers:
    type: application
    platform: iOS
    sources:
      - CargoBrothers
      - Shared
      - path: Fotos.xcassets
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cargobrothers.oficina
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    info:
      path: CargoBrothers/Info.plist
      properties:
        CFBundleDisplayName: Cargo Brothers
        UILaunchScreen: {UIColorName: ""}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSSupportsLiveActivities: true
        NSFaceIDUsageDescription: Para confirmar que eres tú antes de aprobar o rechazar.
        LSApplicationQueriesSchemes: [tg]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.cargobrothers.oficina.refresh]
        BotUsuario: $(BOT_USUARIO)
    dependencies:
      - target: CargoWidgets
  CargoWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cargobrothers.oficina.widgets
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Cargo Brothers
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
