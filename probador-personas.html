<meta charset="utf-8">
<title>Probador de personas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Una sola pantalla: la nave a pantalla completa, barra arriba y leyenda abajo, como la oficina de Cargo Brothers */
:root{
  --bg:#0c0e11; --panel:rgba(18,21,25,.86); --line:#2a2f36; --ink:#e9ebee; --muted:#8b939d; --led:#f4f6f8; --ok:#5CD69A;
  --f-display:"Archivo","Segoe UI",system-ui,sans-serif; --f-mono:"IBM Plex Mono",Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:500 14px/1.45 var(--f-display);overflow:hidden}
#c{position:fixed;inset:0;display:block;width:100%;height:100%;outline:none}
.top{position:fixed;inset:0 0 auto;z-index:5;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(var(--panel),rgba(18,21,25,0));pointer-events:none}
.top>*{pointer-events:auto}
.brand b{font:800 20px var(--f-display);font-stretch:82%;letter-spacing:.01em}
.brand span{display:block;font:500 12px var(--f-mono);color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:600 13px var(--f-mono);color:var(--ink);background:#15191e;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button[aria-pressed="true"]{background:var(--led);color:#0c0e11;border-color:var(--led)}
button:focus-visible{outline:2px solid var(--led);outline-offset:2px}
.legend{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(rgba(18,21,25,0),var(--panel));font:500 12px var(--f-mono);color:var(--muted)}
.legend b{color:var(--ink);font-weight:600}
.keys{display:none}.keys.on{display:inline}
kbd{font:600 11px var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink);background:#15191e}
.tag{position:fixed;z-index:4;transform:translate(-50%,-100%);pointer-events:none;white-space:nowrap;font:600 11px var(--f-mono);
  color:var(--ink);background:rgba(12,14,17,.78);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
.tag i{font-style:normal;color:var(--muted);font-weight:500}
.tag::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:0}
.tag.idle::before{background:var(--muted)}
.pad{position:fixed;z-index:6;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));display:none;grid-template-columns:repeat(3,48px);gap:6px}
.pad.on{display:grid}.pad button{height:48px;padding:0;font-size:18px}
.msg{position:fixed;inset:0;display:grid;place-items:center;font:500 15px var(--f-display);color:var(--muted);padding-inline:max(16px,env(safe-area-inset-left,0px))}
@media (max-width:640px){.legend .long{display:none}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<canvas id="c" tabindex="0" aria-label="Nave de Cargo Brothers con las personas estilizadas"></canvas>
<div class="msg" id="msg">Cargando la nave…</div>
<header class="top">
  <div class="brand"><b>Cargo Brothers · personas</b><span>Prueba de los personajes para la oficina</span></div>
  <div class="btns">
    <button type="button" id="bVer" aria-pressed="true">Vista de la nave</button>
    <button type="button" id="bSanti" aria-pressed="false">Manejar a Santi</button>
  </div>
</header>
<div class="legend" id="legend">
  <span><b>WhatsApp</b> teclea en su puesto</span><span><b>Analista</b> camina al puesto</span><span><b>Pedidos</b> café en el lounge</span>
  <span><b>Finanzas</b> corre en la cinta</span><span><b>Marketplace</b> mancuernas</span><span class="long"><b>Gerente</b> conversa de pie</span>
  <span class="keys" id="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> o flechas para caminar · <kbd>Shift</kbd> correr · <kbd>Esc</kbd> volver</span>
</div>
<div class="pad" id="pad" aria-label="Controles táctiles">
  <span></span><button type="button" data-k="w" aria-label="Adelante">↑</button><span></span>
  <button type="button" data-k="a" aria-label="Izquierda">←</button><button type="button" data-k="s" aria-label="Atrás">↓</button><button type="button" data-k="d" aria-label="Derecha">→</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  const msg = document.getElementById("msg");
  if (!window.THREE) { msg.textContent = "No se pudo cargar el motor 3D."; return; }
  const cv = document.getElementById("c");
  let R;
  try { R = new THREE.WebGLRenderer({ canvas: cv, antialias: true }); } catch (e) { msg.textContent = "Este navegador no tiene WebGL."; return; }
  msg.remove();
  R.setPixelRatio(Math.min(devicePixelRatio, 2)); R.outputEncoding = THREE.sRGBEncoding;
  R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 0.82;
  R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0c0e11); scene.fog = new THREE.Fog(0x0c0e11, 26, 60);
  const cam = new THREE.PerspectiveCamera(42, 1, 0.1, 200); cam.position.set(13, 13.5, 15);
  const ctl = new THREE.OrbitControls(cam, cv); ctl.target.set(1.5, 0.5, -3); ctl.enableDamping = true; ctl.maxPolarAngle = 1.35; ctl.minDistance = 3; ctl.maxDistance = 34;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- Materiales de la nave (mismos tonos que la oficina) ---------- */
  const M = (c, o) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .6, metalness: .05 }, o || {}));
  function marble(base, vein, size) {
    const c = document.createElement("canvas"); c.width = c.height = size || 512; const g = c.getContext("2d");
    g.fillStyle = base; g.fillRect(0, 0, c.width, c.height);
    for (let k = 0; k < 26; k++) {
      g.strokeStyle = vein; g.globalAlpha = .05 + Math.random() * .12; g.lineWidth = .6 + Math.random() * 2.2; g.beginPath();
      let x = Math.random() * c.width, y = 0; g.moveTo(x, y);
      while (y < c.height) { x += (Math.random() - .5) * 40; y += 20 + Math.random() * 30; g.lineTo(x, y); }
      g.stroke();
    }
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; return t;
  }
  const floorT = marble("#c4c6c8", "#6d7176"); floorT.repeat.set(5, 5);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 22), M(0xffffff, { map: floorT, roughness: .22, metalness: .05 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  const wallM = M(0x1b1e22, { roughness: .85 });
  const box = (w, h, d, m, x, y, z, p) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); b.castShadow = b.receiveShadow = true; (p || scene).add(b); return b; };
  const cyl = (rt, rb, h, m, x, y, z, p, s) => { const b = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, s || 16), m); b.position.set(x, y, z); b.castShadow = b.receiveShadow = true; (p || scene).add(b); return b; };
  box(30, 6, 0.3, wallM, 0, 3, -11); box(0.3, 6, 22, wallM, -15, 3, 0);
  // líneas LED blancas arriba (la firma de la nave)
  const ledM = new THREE.MeshBasicMaterial({ color: 0xf4f6f8 });
  [-6, -1, 4].forEach(z => { box(26, 0.05, 0.08, ledM, 0, 5.4, z); });
  box(0.08, 0.05, 20, ledM, -14.6, 5.4, 0); box(28, 0.06, 0.06, ledM, 0, 0.03, -10.82);
  // zonas marcadas en el piso con una línea blanca fina, como el video pero con nuestro LED
  const zoneM = new THREE.MeshBasicMaterial({ color: 0xf4f6f8, transparent: true, opacity: .55 });
  function zone(x, z, w, d) { [[0, -d / 2, w, 0.04], [0, d / 2, w, 0.04], [-w / 2, 0, 0.04, d], [w / 2, 0, 0.04, d]].forEach(([dx, dz, a, b]) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(a, b), zoneM); m.rotation.x = -Math.PI / 2; m.position.set(x + dx, 0.012, z + dz); scene.add(m); }); }
  function floorText(t, x, z, rot) {
    const c = document.createElement("canvas"); c.width = 512; c.height = 96; const g = c.getContext("2d");
    g.font = "800 64px Archivo, sans-serif"; g.fillStyle = "rgba(20,22,26,.55)"; g.textAlign = "center"; g.fillText(t, 256, 70);
    const tx = new THREE.CanvasTexture(c); const m = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 0.6), new THREE.MeshBasicMaterial({ map: tx, transparent: true }));
    m.rotation.x = -Math.PI / 2; m.rotation.z = rot || 0; m.position.set(x, 0.013, z); scene.add(m);
  }
  zone(-7, -6, 8, 7); floorText("OPERACIONES", -7, -2.1);
  zone(3.5, -6, 7, 7); floorText("LOUNGE", 3.5, -2.1);
  zone(10.5, 2, 6.5, 9); floorText("GYM", 10.5, 6.9);

  scene.add(new THREE.HemisphereLight(0xdfe6ee, 0x15171a, .5));
  const sun = new THREE.DirectionalLight(0xffffff, .9); sun.position.set(8, 14, 9); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 14, bottom: -14, near: 1, far: 40 }); sun.shadow.bias = -0.0004; scene.add(sun);
  [[-7, -6], [3.5, -6], [10.5, 2], [-2, 4]].forEach(([x, z]) => { const p = new THREE.PointLight(0xf4f6f8, .35, 12, 2); p.position.set(x, 4.6, z); scene.add(p); });

  /* ---------- Muebles ---------- */
  const graf = M(0x1c1f23, { roughness: .45 }), metal = M(0x2b2f35, { metalness: .6, roughness: .35 }), blackM = M(0x0f1113, { roughness: .5 });
  const marbN = marble("#16181b", "#8a8f96"); const deskTop = M(0xffffff, { map: marbN, roughness: .2 });
  function screenTex(color) {
    const c = document.createElement("canvas"); c.width = 256; c.height = 150; const g = c.getContext("2d");
    g.fillStyle = "#0b0d10"; g.fillRect(0, 0, 256, 150); g.strokeStyle = color; g.lineWidth = 3; g.beginPath();
    let y = 110; for (let x = 10; x < 250; x += 12) { y += (Math.random() - .45) * 22; y = Math.max(20, Math.min(135, y)); x === 10 ? g.moveTo(x, y) : g.lineTo(x, y); } g.stroke();
    g.fillStyle = "#e9ebee"; g.font = "600 16px IBM Plex Mono, monospace"; g.fillText("7700X  USD 199,99", 12, 22);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
  }
  function desk(x, z, rot) {
    const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rot || 0; scene.add(g);
    box(1.8, 0.06, 0.8, deskTop, 0, 0.76, 0, g); box(0.06, 0.74, 0.7, graf, -0.85, 0.37, 0, g); box(0.06, 0.74, 0.7, graf, 0.85, 0.37, 0, g);
    box(0.9, 0.52, 0.04, blackM, 0, 1.12, -0.28, g);
    const s = new THREE.Mesh(new THREE.PlaneGeometry(0.84, 0.46), new THREE.MeshBasicMaterial({ map: screenTex("#f4f6f8"), toneMapped: false })); s.position.set(0, 1.12, -0.255); g.add(s);
    box(0.06, 0.22, 0.06, metal, 0, 0.87, -0.3, g); box(0.5, 0.02, 0.16, M(0x16181b), 0, 0.8, 0.08, g);
    // silla
    const ch = new THREE.Group(); ch.position.set(0, 0, 0.62); g.add(ch);
    box(0.5, 0.08, 0.5, graf, 0, 0.47, 0, ch); box(0.5, 0.62, 0.07, graf, 0, 0.82, 0.24, ch); cyl(0.03, 0.03, 0.42, metal, 0, 0.24, 0, ch, 8); cyl(0.26, 0.26, 0.03, metal, 0, 0.03, 0, ch, 5);
    return g;
  }
  desk(-9, -7.5); desk(-5, -7.5); desk(-9, -4.4);
  // lounge: sofá, mesa de centro, máquina de café
  const sofaM = M(0x2d3138, { roughness: .9 });
  const sofa = new THREE.Group(); sofa.position.set(3.5, 0, -8.2); scene.add(sofa);
  box(3, 0.42, 0.95, sofaM, 0, 0.21, 0, sofa); box(3, 0.6, 0.22, sofaM, 0, 0.6, -0.38, sofa); box(0.22, 0.32, 0.95, sofaM, -1.4, 0.55, 0, sofa); box(0.22, 0.32, 0.95, sofaM, 1.4, 0.55, 0, sofa);
  box(1.4, 0.06, 0.7, deskTop, 3.5, 0.42, -6.7); cyl(0.05, 0.05, 0.4, metal, 3.5, 0.2, -6.7, scene, 8);
  box(0.55, 1.4, 0.5, blackM, 6.3, 0.7, -9.3); box(0.4, 0.08, 0.06, ledM, 6.3, 1.1, -9.04);
  // gym: cinta, rack de mancuernas, banco
  const tread = new THREE.Group(); tread.position.set(9, 0, -0.5); scene.add(tread);
  box(0.8, 0.12, 1.9, blackM, 0, 0.12, 0, tread); box(0.66, 0.02, 1.7, M(0x2a2d31, { roughness: .95 }), 0, 0.19, 0, tread);
  box(0.06, 1.15, 0.06, metal, -0.36, 0.7, -0.85, tread); box(0.06, 1.15, 0.06, metal, 0.36, 0.7, -0.85, tread); box(0.8, 0.18, 0.2, blackM, 0, 1.28, -0.85, tread);
  box(1.8, 0.06, 0.4, metal, 12, 0.6, 1.2); box(0.06, 0.6, 0.4, metal, 11.15, 0.3, 1.2); box(0.06, 0.6, 0.4, metal, 12.85, 0.3, 1.2);
  for (let k = 0; k < 5; k++) { const x = 11.3 + k * 0.35; cyl(0.07, 0.07, 0.3, blackM, x, 0.72, 1.2, scene, 10).rotation.z = Math.PI / 2; }

  /* ---------- Persona realista ---------- */
  const SKIN = [0xe7c3a1, 0xc99a76, 0x9e6e4c, 0x6e4a33, 0xf0d2b8];
  const HAIR = [0x1b1612, 0x3a2a1e, 0x6b4a2e, 0x111111, 0xb08a5a];
  function capsule(r, len, m, segs) {   // cápsula hecha con un torno: bordes redondos, se ve "de juego"
    const pts = [], n = 8;
    for (let i = 0; i <= n; i++) { const a = -Math.PI / 2 + (i / n) * Math.PI / 2; pts.push(new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r - len / 2)); }
    for (let i = 0; i <= n; i++) { const a = (i / n) * Math.PI / 2; pts.push(new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r + len / 2)); }
    const me = new THREE.Mesh(new THREE.LatheGeometry(pts, segs || 16), m); me.castShadow = true; return me;
  }
  function taper(rTop, rBot, len, m) {   // miembro que se afina, con las puntas redondeadas
    const pts = [new THREE.Vector2(0, -len / 2 - rBot * .6)];
    for (let i = 1; i <= 4; i++) { const a = -Math.PI / 2 + i / 4 * Math.PI / 2; pts.push(new THREE.Vector2(Math.cos(a) * rBot, -len / 2 + Math.sin(a) * rBot * .6)); }
    for (let i = 0; i <= 4; i++) { const a = i / 4 * Math.PI / 2; pts.push(new THREE.Vector2(Math.cos(a) * rTop, len / 2 + Math.sin(a) * rTop * .6)); }
    const me = new THREE.Mesh(new THREE.LatheGeometry(pts, 14), m); me.castShadow = true; return me;
  }
  /* Persona realista: un solo cuerpo con huesos (SkinnedMesh) que se dobla en codos, rodillas y cintura, sin piezas sueltas.
     Pose de reposo de pie con los brazos colgando: todos los tramos son verticales, así cada anillo es una elipse horizontal. */
  function persona(o) {
    const mujer = !!o.mujer, H = o.alto || 1;
    const col = c => new THREE.Color(c);
    const cSkin = col(o.skin), cShirt = col(o.shirt), cPants = col(o.pants), cBelt = col(0x0d0e10);
    const root = new THREE.Group(); root.scale.setScalar(H); scene.add(root);
    // ---- huesos (posiciones locales al padre) ----
    const B = {}; const bone = (n, p, x, y, z) => { const b = new THREE.Bone(); b.name = n; b.position.set(x, y, z); if (p) B[p].add(b); B[n] = b; return b; };
    bone("hips", null, 0, 0.95, 0);
    bone("spine", "hips", 0, 0.1, 0); bone("chest", "spine", 0, 0.2, 0); bone("neck", "chest", 0, 0.24, 0); bone("head", "neck", 0, 0.1, 0);
    const SW = mujer ? 0.185 : 0.2;
    [["l", -1], ["r", 1]].forEach(([s, sx]) => {
      bone(s + "sh", "chest", sx * SW, 0.19, 0); bone(s + "el", s + "sh", 0, -0.27, 0); bone(s + "wr", s + "el", 0, -0.255, 0);
      bone(s + "th", "hips", sx * 0.095, -0.03, 0); bone(s + "kn", s + "th", 0, -0.43, 0); bone(s + "an", s + "kn", 0, -0.42, 0);
    });
    const order = Object.keys(B), idx = n => order.indexOf(n);
    root.add(B.hips); root.updateMatrixWorld(true);
    const wy = n => { const v = new THREE.Vector3(); B[n].getWorldPosition(v); return v.y / H; };
    // ---- geometría: anillos elípticos a lo largo de cada tramo ----
    const pos = [], nor = [], colr = [], si = [], sw = [], ind = [];
    const SEG = 18;
    function tube(cx, cz, rings, weightAt, colorAt, capBottom) {
      // rings: [{y, rx, rz, dz}] de abajo hacia arriba
      const base = pos.length / 3;
      rings.forEach((r, i) => {
        const [wi, ww] = weightAt(r.y), c = colorAt(r.y);
        for (let k = 0; k < SEG; k++) {
          const a = k / SEG * Math.PI * 2, x = Math.sin(a), z = Math.cos(a);
          pos.push(cx + x * r.rx, r.y, cz + (r.dz || 0) + z * r.rz);
          const nx = x / r.rx, nz = z / r.rz, l = Math.hypot(nx, nz); nor.push(nx / l, 0, nz / l);
          colr.push(c.r, c.g, c.b); si.push(wi[0], wi[1], 0, 0); sw.push(ww[0], ww[1], 0, 0);
        }
        if (i) for (let k = 0; k < SEG; k++) { const a = base + (i - 1) * SEG + k, b = base + (i - 1) * SEG + (k + 1) % SEG, c2 = a + SEG, d = b + SEG; ind.push(a, b, d, a, d, c2); }
      });
      if (capBottom) { const r0 = rings[0], ci = pos.length / 3; pos.push(cx, r0.y - 0.004, cz + (r0.dz || 0)); nor.push(0, -1, 0); const [wi, ww] = weightAt(r0.y), c = colorAt(r0.y); colr.push(c.r, c.g, c.b); si.push(wi[0], wi[1], 0, 0); sw.push(ww[0], ww[1], 0, 0); for (let k = 0; k < SEG; k++) ind.push(ci, base + (k + 1) % SEG, base + k); }
    }
    const blend = (y, yj, w, below, above) => {   // mezcla suave de dos huesos alrededor de una articulación
      const t = THREE.MathUtils.clamp((y - (yj - w)) / (2 * w), 0, 1), s = t * t * (3 - 2 * t);
      return [[idx(below), idx(above)], [1 - s, s]];
    };
    // torso: entrepierna → cintura → pecho → hombros → cuello
    const yH = wy("hips"), ySp = wy("spine"), yCh = wy("chest"), yNk = wy("neck"), yHd = wy("head");
    const T = mujer
      ? [[0.86, .07, .06], [0.9, .15, .1], [0.96, .175, .115], [1.03, .165, .105], [1.1, .135, .095], [1.18, .13, .095], [1.26, .145, .11, .012], [1.33, .16, .125, .02], [1.4, .165, .11, .01], [1.44, .168, .095], [1.47, .148, .082], [1.495, .11, .07], [1.52, .058, .054], [1.6, .05, .05]]
      : [[0.86, .07, .06], [0.9, .145, .1], [0.96, .16, .105], [1.03, .155, .1], [1.1, .148, .098], [1.18, .152, .1], [1.26, .168, .11, .008], [1.34, .185, .118, .01], [1.4, .195, .112], [1.44, .19, .1], [1.475, .165, .085], [1.5, .12, .072], [1.525, .065, .06], [1.61, .055, .055]];
    const yWaist = 1.0, yCollar = 1.515;
    tube(0, 0, T.map(([y, rx, rz, dz]) => ({ y, rx, rz, dz })), y => {
      if (y < ySp + 0.04) return blend(y, ySp, 0.06, "hips", "spine");
      if (y < yCh + 0.04) return blend(y, yCh, 0.06, "spine", "chest");
      return blend(y, yNk, 0.03, "chest", "neck");
    }, y => y > yCollar ? cSkin : Math.abs(y - yWaist) < 0.018 ? cBelt : y < yWaist ? cPants : cShirt, true);
    // piernas
    [["l", -1], ["r", 1]].forEach(([s, sx]) => {
      const x = sx * 0.095, yT = wy(s + "th"), yK = wy(s + "kn"), yA = wy(s + "an");
      const L = [[yA - 0.03, .034, .036], [yA + 0.02, .037, .04], [yA + 0.1, .044, .047], [yK - 0.17, .058, .062], [yK - 0.08, .056, .058], [yK, .052, .054], [yK + 0.06, .06, .062], [yK + 0.2, .075, .078], [yT - 0.06, .087, .088], [yT + 0.04, .09, .09]];
      tube(x, 0, L.map(([y, rx, rz]) => ({ y, rx: rx * (mujer ? .95 : 1), rz })), y => {
        if (y > yT - 0.05) return blend(y, yT, 0.05, s + "th", "hips");
        return blend(y, yK, 0.045, s + "kn", s + "th");
      }, y => o.shorts && y < yK + 0.12 ? cSkin : cPants, true);
    });
    // brazos (camisa hasta la muñeca, o manga corta)
    [["l", -1], ["r", 1]].forEach(([s, sx]) => {
      const x = sx * SW, yS = wy(s + "sh"), yE = wy(s + "el"), yW = wy(s + "wr");
      const A = [[yW - 0.01, .029, .022], [yW + 0.03, .031, .025], [yE - 0.12, .038, .034], [yE - 0.04, .041, .037], [yE, .038, .036], [yE + 0.08, .043, .042], [yS - 0.1, .05, .05], [yS - 0.03, .056, .055], [yS + 0.03, .055, .05]];
      tube(x, 0, A.map(([y, rx, rz]) => ({ y, rx: rx * (mujer ? .9 : 1), rz: rz * (mujer ? .9 : 1) })), y => {
        if (y > yS - 0.05) return blend(y, yS, 0.04, s + "sh", "chest");
        return blend(y, yE, 0.04, s + "el", s + "sh");
      }, y => (o.mangaCorta ? y < yS - 0.13 : y < yW + 0.015) ? cSkin : cShirt, true);
    });
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
    g.setAttribute("color", new THREE.Float32BufferAttribute(colr, 3));
    g.setAttribute("skinIndex", new THREE.Uint16BufferAttribute(si, 4)); g.setAttribute("skinWeight", new THREE.Float32BufferAttribute(sw, 4));
    g.setIndex(ind); g.computeVertexNormals();
    const body = new THREE.SkinnedMesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .72, metalness: 0, skinning: true }));
    body.castShadow = true; body.receiveShadow = true; body.frustumCulled = false;
    root.add(body); body.bind(new THREE.Skeleton(order.map(n => B[n])));
    // ---- piezas rígidas: cuello de camisa, cabeza, manos, zapatos ----
    const skinM = M(o.skin, { roughness: .5 }), hairM = M(o.hair, { roughness: .75 }), shirtM = M(o.shirt, { roughness: .7 });
    if (!o.tank && !o.mangaCorta) { const cl = new THREE.Mesh(new THREE.TorusGeometry(0.062, 0.014, 6, 18), shirtM); cl.rotation.x = Math.PI / 2 - 0.25; cl.position.set(0, 0.255, 0.012); cl.scale.set(1.05, 1.15, 1); B.chest.add(cl); }
    const head = new THREE.Group(); B.head.add(head);
    const add = (geo, m, x, y, z, sx, sy, sz, p) => { const me = new THREE.Mesh(geo, m); me.position.set(x, y, z); me.scale.set(sx || 1, sy || 1, sz || 1); me.castShadow = true; (p || head).add(me); return me; };
    const S = (r, a, b) => new THREE.SphereGeometry(r, a || 24, b || 18);
    add(S(0.1), skinM, 0, 0.1, 0, 0.88, 1.08, 0.98);                    // cráneo
    add(S(0.07), skinM, 0, 0.058, 0.012, 0.8, 0.88, 0.86);              // mandíbula y mentón
    [-1, 1].forEach(sx => add(S(0.024, 10, 8), skinM, sx * 0.087, 0.09, -0.005, 0.45, 1, 0.8)); // orejas
    const white = M(0xf2f2f0, { roughness: .3 }), iris = M(0x2a1d14, { roughness: .2 }), brow = hairM, lip = M(new THREE.Color(o.skin).multiplyScalar(0.78).getHex(), { roughness: .5 });
    [-1, 1].forEach(sx => {
      add(S(0.0125, 12, 10), white, sx * 0.031, 0.108, 0.086, 1.25, 0.75, 0.55);
      add(S(0.0072, 10, 8), iris, sx * 0.031, 0.108, 0.0925);
      const b = add(new THREE.BoxGeometry(0.034, 0.0065, 0.008), brow, sx * 0.032, 0.128, 0.092); b.rotation.z = sx * -0.12;
    });
    add(new THREE.ConeGeometry(0.0135, 0.034, 10), skinM, 0, 0.088, 0.1).rotation.x = Math.PI / 2 - 0.4;   // nariz
    add(S(0.015, 12, 8), lip, 0, 0.06, 0.084, 1.3, 0.4, 0.5);          // labios
    // pelo
    const cap = add(new THREE.SphereGeometry(0.104, 26, 16, 0, Math.PI * 2, 0, Math.PI * 0.56), hairM, 0, 0.112, -0.006, 0.92, 1.12, 1.03); cap.rotation.x = -0.22;
    if (o.peinado === "corto") { add(S(0.06, 14, 10), hairM, 0, 0.1, -0.06, 1.35, 1.1, 0.8); }
    if (o.peinado === "largo" || o.peinado === "cola" || o.peinado === "mono") {
      if (o.peinado === "largo") {
        const hp = [[0.0, 0.215], [0.08, 0.2], [0.104, 0.13], [0.106, 0.05], [0.11, -0.03], [0.12, -0.1], [0.105, -0.115]].map(([x, y]) => new THREE.Vector2(x, y));
        const mel = new THREE.Mesh(new THREE.LatheGeometry(hp, 26, Math.PI * 0.3, Math.PI * 1.4), M(o.hair, { roughness: .75, side: THREE.DoubleSide }));
        mel.position.set(0, 0.0, -0.005); mel.scale.set(0.95, 1, 1.05); mel.castShadow = true; head.add(mel);
      } else if (o.peinado === "cola") { add(S(0.05, 14, 10), hairM, 0, 0.1, -0.1, 0.9, 0.9, 0.9); const c = add(new THREE.CylinderGeometry(0.03, 0.012, 0.2, 10), hairM, 0, 0.0, -0.13); c.rotation.x = 0.25; }
      else add(S(0.05, 14, 10), hairM, 0, 0.2, -0.06);
    }
    // manos (palma + pulgar) y zapatos
    const hands = [["l", -1], ["r", 1]].map(([s, sx]) => {
      const h = new THREE.Group(); h.position.y = -0.01; B[s + "wr"].add(h);
      add(S(0.035, 14, 10), skinM, 0, -0.055, 0, 0.75, 1.45, 0.42, h);
      add(S(0.032, 12, 8), skinM, 0, -0.105, 0.004, 0.72, 0.9, 0.4, h);     // dedos juntos
      const th = add(new THREE.CylinderGeometry(0.011, 0.009, 0.05, 8), skinM, -sx * 0.024, -0.05, 0.016, 1, 1, 1, h); th.rotation.z = sx * 0.5;
      return h;
    });
    const shoeM = M(o.shoe || 0x121315, { roughness: .35, metalness: .1 }), soleM = M(0x1d1f22, { roughness: .8 });
    [["l", -1], ["r", 1]].forEach(([s]) => {
      const f = new THREE.Group(); f.position.y = -0.055; B[s + "an"].add(f);
      add(S(0.05, 16, 10), shoeM, 0, 0.0, 0.045, 0.82, 0.62, 2.1, f);
      add(new THREE.BoxGeometry(0.085, 0.016, 0.24), soleM, 0, -0.026, 0.04, 1, 1, 1, f);
    });
    const P = { root, hips: B.hips, spine: B.spine, chest: B.chest, head: B.head,
      arms: ["l", "r"].map((s, i) => ({ sh: B[s + "sh"], el: B[s + "el"], wr: B[s + "wr"], hand: hands[i] })),
      legs: ["l", "r"].map(s => ({ hp: B[s + "th"], kn: B[s + "kn"], an: B[s + "an"] })), cur: {} };
    return P;
  }

  /* ---------- Poses y movimientos (ángulos por articulación, mezclados con suavidad) ---------- */
  const lerp = (a, b, k) => a + (b - a) * k;
  function pose(P, t, kind, k) {
    const q = {}; const s = Math.sin;
    let hy = 0.95, lean = 0, hipRotY = 0;
    const set = (n, v) => { q[n] = v; };
    // por defecto: de pie, brazos sueltos
    ["lth", "rth", "lkn", "rkn", "lan", "ran", "lsx", "rsx", "lsz", "rsz", "lel", "rel", "hx", "hy"].forEach(n => set(n, 0));
    set("lsz", 0.08); set("rsz", -0.08); set("lel", -0.15); set("rel", -0.15);
    if (kind === "idle" || kind === "habla") {

      if (kind === "habla") { set("rsx", -0.55 + s(t * 2.2) * 0.25); set("rel", -1.1 + s(t * 3) * 0.2); set("lsx", -0.2 + s(t * 1.7 + 1) * 0.12); set("lel", -0.5); set("hy", s(t * 0.9) * 0.35); }

      set("lan", Math.max(0, -s(ph)) * 0.25); set("ran", Math.max(0, s(ph)) * 0.25);
      set("lsx", s(ph) * a * 0.8); set("rsx", -s(ph) * a * 0.8);
      set("lel", run ? -1.4 : -0.25 - Math.max(0, -s(ph)) * 0.3); set("rel", run ? -1.4 : -0.25 - Math.max(0, s(ph)) * 0.3);
      hy = 0.95 + Math.abs(s(ph)) * (run ? 0.06 : 0.03) - (run ? 0.03 : 0); lean = run ? 0.18 : 0.04; hipRotY = s(ph) * 0.08;
    }
    if (kind === "teclea" || kind === "cafe") {
      hy = 0.5; set("lth", -1.52); set("rth", -1.52); set("lkn", 1.5); set("rkn", 1.5);
      if (kind === "teclea") {
        lean = 0.12; set("lsx", -0.55); set("rsx", -0.55); set("lsz", 0.18); set("rsz", -0.18);
        set("lel", -1.0 + s(t * 13) * 0.06); set("rel", -1.0 + s(t * 11 + 1) * 0.06); set("hx", 0.12 + s(t * 0.7) * 0.03);
      } else {
        hy = 0.47; lean = -0.22; set("lth", -1.35); set("rth", -1.45); set("lkn", 1.25); set("rkn", 1.45);
        const sorbo = Math.max(0, s(t * 0.7)) ** 3;   // cada tanto lleva la taza a la boca
        set("rsx", -0.35 - sorbo * 0.55); set("rel", -1.5 - sorbo * 0.55); set("rsz", -0.2);
        set("lsx", -0.3); set("lel", -0.7); set("lsz", 0.25); set("hx", -sorbo * 0.18);
      }
    }
    if (kind === "pesas") {
      const ph = t * 2.6; set("lsx", -0.05); set("rsx", -0.05); set("lsz", 0.12); set("rsz", -0.12);
      set("lel", -0.2 - Math.max(0, s(ph)) * 2.0); set("rel", -0.2 - Math.max(0, -s(ph)) * 2.0);
      set("lkn", 0.08); set("rkn", 0.08); hy = 0.94;
    }
    // aplicar con mezcla
    const c = P.cur; k = reduce ? 1 : k;
    for (const n in q) c[n] = c[n] == null ? q[n] : lerp(c[n], q[n], k);
    c._hy = c._hy == null ? hy : lerp(c._hy, hy, k); c._lean = c._lean == null ? lean : lerp(c._lean, lean, k); c._hry = c._hry == null ? hipRotY : lerp(c._hry, hipRotY, k);

    P.legs[0].hp.rotation.x = c.lth; P.legs[1].hp.rotation.x = c.rth; P.legs[0].kn.rotation.x = c.lkn; P.legs[1].kn.rotation.x = c.rkn;
    P.legs[0].an.rotation.x = c.lan; P.legs[1].an.rotation.x = c.ran;

    P.arms[0].sh.rotation.z = -0.08 - Math.max(0, c.lsz - 0.08); P.arms[1].sh.rotation.z = 0.08 + Math.max(0, -c.rsz - 0.08);
  }

  /* ---------- El elenco: cada agente con su rutina ---------- */
  const tagsEl = [];
  function agente(nombre, que, o, rutina) {
    const P = persona(o); P.nombre = nombre; P.que = que; P.rutina = rutina;
    const el = document.createElement("div"); el.className = "tag"; el.innerHTML = `${nombre} <i>· ${que}</i>`; document.body.appendChild(el); P.tag = el; tagsEl.push(P);
    return P;
  }
  const mug = () => { const g = new THREE.Group(); cyl(0.04, 0.035, 0.09, M(0xf4f6f8), 0, 0, 0, g, 12); return g; };
  const dumbbell = () => { const g = new THREE.Group(); cyl(0.012, 0.012, 0.2, metal, 0, 0, 0, g, 6).rotation.z = Math.PI / 2; [-0.09, 0.09].forEach(x => cyl(0.04, 0.04, 0.05, blackM, x, 0, 0, g, 10).rotation.z = Math.PI / 2); return g; };

  const wa = agente("WhatsApp", "teclea en su puesto", { skin: SKIN[0], shirt: 0xf2f3f5, pants: 0x23272d, hair: HAIR[0], peinado: "cola", mujer: true, alto: .96 }, "teclea");
  wa.root.position.set(-9, 0, -6.86); wa.root.rotation.y = Math.PI;
  const ana = agente("Analista", "camina a su puesto", { skin: SKIN[2], shirt: 0xdfe6ee, pants: 0x1f2328, hair: HAIR[3], peinado: "corto" }, "camina");
  const ped = agente("Pedidos", "café en el lounge", { skin: SKIN[1], shirt: 0xf4f6f8, pants: 0x2a2e33, hair: HAIR[1], peinado: "largo", mujer: true, alto: .95 }, "cafe");
  ped.root.position.set(3.0, 0, -8.05); ped.root.rotation.y = 0; { const m = mug(); m.position.set(0, -0.08, 0.035); ped.arms[1].wr.add(m); }
  const fin = agente("Finanzas", "corre en la cinta", { skin: SKIN[4], shirt: 0x2b2f35, pants: 0x15171a, hair: HAIR[4], peinado: "cola", mujer: true, shorts: true, mangaCorta: true, shoe: 0xf4f6f8, alto: .96 }, "corre");
  fin.root.position.set(9, 0.19, -0.4); fin.root.rotation.y = Math.PI;
  const mkt = agente("Marketplace", "mancuernas", { skin: SKIN[3], shirt: 0x8b939d, pants: 0x1b1e22, hair: HAIR[0], peinado: "corto", shorts: true, mangaCorta: true, shoe: 0xf4f6f8 }, "pesas");
  mkt.root.position.set(12, 0, 2.6); mkt.root.rotation.y = Math.PI;
  [0, 1].forEach(i => { const d = dumbbell(); d.position.y = -0.07; mkt.arms[i].wr.add(d); });
  const ger = agente("Gerente", "conversa de pie", { skin: SKIN[1], shirt: 0x111316, pants: 0x111316, hair: HAIR[3], peinado: "corto" }, "habla");
  ger.root.position.set(-2.4, 0, -4.2); ger.root.rotation.y = 0.9;
  const santi = agente("Santi", "tú", { skin: SKIN[0], shirt: 0xf4f6f8, pants: 0x1a1d21, hair: HAIR[1], peinado: "corto" }, "idle");
  santi.root.position.set(-1.2, 0, -3.1); santi.root.rotation.y = -2.2;

  // ruta del Analista: entra por el pasillo, llega a su silla, se sienta y teclea un rato, vuelve a salir
  const rutaAna = [[1.5, 3.5], [-2.5, 1.0], [-5, -3.6], [-5, -6.86]];
  let anaFase = "camina", anaI = 0, anaT = 0;
  ana.root.position.set(rutaAna[0][0], 0, rutaAna[0][1]);

  /* ---------- Modo teclado: manejar a Santi ---------- */
  const keys = {}; let modo = "ver";
  const bVer = document.getElementById("bVer"), bSanti = document.getElementById("bSanti"), keysEl = document.getElementById("keys"), pad = document.getElementById("pad");
  const touch = matchMedia("(pointer: coarse)").matches;
  function setModo(m) {
    modo = m; bVer.setAttribute("aria-pressed", m === "ver"); bSanti.setAttribute("aria-pressed", m === "santi");
    keysEl.classList.toggle("on", m === "santi"); pad.classList.toggle("on", m === "santi" && touch);
    ctl.enabled = m === "ver"; if (m === "santi") cv.focus();
  }
  bVer.onclick = () => setModo("ver"); bSanti.onclick = () => setModo("santi");
  addEventListener("keydown", e => { if (e.key === "Escape") setModo("ver"); keys[e.key.toLowerCase()] = true; if (modo === "santi" && /^(arrow|w|a|s|d| )/i.test(e.key)) e.preventDefault(); });
  addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
  pad.querySelectorAll("[data-k]").forEach(b => { const k = b.dataset.k; const on = v => e => { e.preventDefault(); keys[k] = v; };
    b.addEventListener("pointerdown", on(true)); b.addEventListener("pointerup", on(false)); b.addEventListener("pointerleave", on(false)); });
  const camOff = new THREE.Vector3(0, 3.2, 5.2), tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();

  /* ---------- Bucle ---------- */
  function size() { const w = innerWidth, h = innerHeight; R.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  addEventListener("resize", size); size();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000, k = 1 - Math.exp(-dt * 8);
    pose(wa, t, "teclea", k); pose(ped, t, "cafe", k); pose(fin, t, "corre", k); pose(mkt, t, "pesas", k); pose(ger, t, "habla", k);
    // Analista
    if (anaFase === "camina") {
      const [x, z] = rutaAna[anaI + 1], dx = x - ana.root.position.x, dz = z - ana.root.position.z, d = Math.hypot(dx, dz), v = 1.25 * dt;
      if (d < v) { ana.root.position.set(x, 0, z); anaI++; if (anaI >= rutaAna.length - 1) { anaFase = "sentado"; anaT = 0; ana.root.rotation.y = Math.PI; } }
      else { ana.root.position.x += dx / d * v; ana.root.position.z += dz / d * v; const ry = Math.atan2(dx, dz); ana.root.rotation.y = lerp(ana.root.rotation.y, ry, k); }

    } else { anaT += dt; pose(ana, t, "teclea", k); if (anaT > 9) { anaFase = "camina"; anaI = 0; rutaAna.reverse(); ana.root.position.set(rutaAna[0][0], 0, rutaAna[0][1]); } }
    // Santi
    if (modo === "santi") {
      const fx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0), fz = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
      const run = keys.shift, sp = (run ? 3.6 : 1.6) * dt;
      if (fx || fz) {
        // relativo a la cámara
        cam.getWorldDirection(tmp); tmp.y = 0; tmp.normalize(); tmp2.set(-tmp.z, 0, tmp.x);
        const mx = tmp2.x * fx - tmp.x * fz, mz = tmp2.z * fx - tmp.z * fz, n = Math.hypot(mx, mz) || 1;
        santi.root.position.x = THREE.MathUtils.clamp(santi.root.position.x + mx / n * sp, -14.4, 14.4);
        santi.root.position.z = THREE.MathUtils.clamp(santi.root.position.z + mz / n * sp, -10.4, 10.4);
        const ry = Math.atan2(mx, mz); let dr = ry - santi.root.rotation.y; dr = Math.atan2(Math.sin(dr), Math.cos(dr)); santi.root.rotation.y += dr * k * 1.5;
        pose(santi, t, run ? "corre" : "camina", k);
      } else pose(santi, t, "idle", k);
      const want = tmp.copy(santi.root.position).add(camOff); cam.position.lerp(want, 1 - Math.exp(-dt * 4));
      ctl.target.lerp(tmp2.copy(santi.root.position).setY(1.1), 1 - Math.exp(-dt * 6)); cam.lookAt(ctl.target);
    } else { pose(santi, t, "idle", k); ctl.update(); }
    R.render(scene, cam);
    // etiquetas sobre la cabeza
    tagsEl.forEach(P => { tmp.set(0, 0, 0); P.head.localToWorld(tmp); tmp.y += 0.42; tmp.project(cam);
      const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1; P.tag.style.display = vis ? "" : "none";
      if (vis) { P.tag.style.left = (tmp.x * .5 + .5) * innerWidth + "px"; P.tag.style.top = (-tmp.y * .5 + .5) * innerHeight + "px"; } });
    requestAnimationFrame(frame);
  }
  window.__probador = { cam, ctl };
  requestAnimationFrame(frame);
})();
